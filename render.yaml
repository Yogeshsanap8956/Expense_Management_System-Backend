services:
  - type: web
    name: mandal-api
    runtime: docker
    plan: starter
    healthCheckPath: /health
    disk:
      name: mandal-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////data/mandal.db
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: CORS_ORIGINS
        value: https://expense-frontend.y6303235.workers.dev
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.(pages\.dev|workers\.dev)
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PHONE
        value: "9999999999"
      - key: ADMIN_PASSWORD
        value: admin123
